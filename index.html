<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d13"><title>Dating Pipeline</title><style>
:root{color-scheme:dark;--bg:#0b0d13;--panel:#151924;--panel2:#202636;--line:#303747;--muted:#9aa5b8;--ink:#f3f5fa;--accent:#91aaff;--green:#8bd3b3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.4}main{max-width:600px;margin:auto;padding:24px 16px 108px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}h1{font-size:26px;margin:0;letter-spacing:-.7px}h2{font-size:18px;margin:24px 0 12px}h3{font-size:15px;margin:0 0 8px}p{line-height:1.5}.muted,small{color:var(--muted)}small{font-size:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:15px;margin-bottom:11px}.soft{background:var(--panel2);border-radius:12px;padding:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.stack{display:grid;gap:10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 8px;text-align:center}.stat strong{display:block;font-size:24px}.stat small{font-size:11px}.btn{background:var(--accent);color:#101522;border:0;border-radius:12px;padding:12px 15px;font-weight:700}.btn.secondary{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}.btn.ghost{background:transparent;color:var(--accent);padding:8px}.btn.danger{background:#4d2630;color:#ffb8c1}.wide{width:100%}.pill{border-radius:20px;background:#283149;color:#c7d5ff;padding:5px 9px;font-size:11px;white-space:nowrap}.pill.high{background:#193b34;color:#a8e4d0}.pill.low{background:#433034;color:#ffbdc4}.field{display:grid;gap:7px;margin:13px 0}label{font-size:13px;color:#c8d0df;font-weight:600}input,select,textarea{width:100%;background:#101520;color:var(--ink);border:1px solid #384154;border-radius:11px;padding:12px;outline:none}textarea{min-height:82px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--accent)}.section{margin-top:19px}.stagehead{width:100%;display:flex;align-items:center;justify-content:space-between;background:transparent;color:var(--ink);border:0;padding:13px 2px;font-weight:700;text-align:left}.person{display:block;width:100%;text-align:left;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:8px}.person .sub{color:var(--muted);font-size:12px;margin-top:6px}.nav{position:fixed;bottom:0;left:0;right:0;background:#121620ed;backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:9px 8px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:5}.nav-inner{max-width:600px;width:100%;display:grid;grid-template-columns:repeat(4,1fr)}.nav button{border:0;background:transparent;color:var(--muted);font-size:11px;padding:7px 0;display:grid;gap:4px;justify-items:center}.nav button.active{color:var(--accent)}.nav b{font-size:20px}.hide{display:none!important}.back{background:transparent;border:0;color:var(--accent);padding:0;margin-bottom:18px}.line{border:0;border-top:1px solid var(--line);margin:16px 0}.event{border-left:2px solid var(--line);padding:2px 0 15px 14px;margin-left:5px}.event:last-child{border:0}.notice{font-size:13px;color:#cbd5e7;background:#242d3f;border-radius:12px;padding:12px;line-height:1.5}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:9px}.bar{height:8px;background:#2c3444;border-radius:10px;overflow:hidden}.bar>div{height:100%;background:var(--accent)}.tag{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}.message{background:#283348;border-radius:16px;padding:16px;line-height:1.5;margin:10px 0}.empty{color:var(--muted);font-size:13px;padding:10px 0}a{color:var(--accent)}
</style></head><body><main><header><div><h1>Dating Pipeline</h1><small id="subtitle">Din översikt</small></div><button class="btn" id="addTop" onclick="openAdd()">+ Lägg till</button></header><div id="screen"></div></main><nav class="nav"><div class="nav-inner"><button data-tab="pipeline" onclick="go('pipeline')"><b>▦</b>Pipeline</button><button data-tab="messages" onclick="go('messages')"><b>✉</b>Meddelanden</button><button data-tab="insights" onclick="go('insights')"><b>▥</b>Insikter</button><button data-tab="settings" onclick="go('settings')"><b>⚙</b>Inställningar</button></div></nav><script>
const STAGES=[['contact','Kontakt etablerad'],['conversation','Konversation startad'],['engaged','Engagerad konversation'],['proposed','Dejt föreslagen'],['scheduled','Dejt bokad'],['first','Första dejten genomförd'],['repeat','Flera dejter']];const SOURCES=['Hinge','Utekväll','Via vänner','Annat'];const PLATFORMS=['Ingen','Instagram','Snapchat','WhatsApp','SMS/iMessage','Hinge','Egen länk'];const INTEREST=['Okänt','Lågt','Måttligt','Högt'];const EVENTS=[['reply','Hon svarade','conversation'],['engaged','Konversationen blev ömsesidig','engaged'],['proposed','Jag föreslog en dejt','proposed'],['scheduled','Vi bokade en dejt','scheduled'],['first','Första dejten genomfördes','first'],['repeat','Ytterligare en dejt genomfördes','repeat']];const KEY='dating-pipeline-v1';let db=load(),tab='pipeline',profile=null,filter='',collapsed={},msgTarget='',drafts=[];function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return x&&Array.isArray(x.people)?x:{people:[]}}catch{return{people:[]}}}function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Kunde inte spara lokalt: '+e.message)}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function date(t){return new Date(t).toLocaleDateString('sv-SE',{day:'numeric',month:'short'})}function stage(s){return STAGES.find(x=>x[0]===s)?.[1]||s}function person(id){return db.people.find(p=>p.id===id)}function getLink(p){let v=(p.handle||'').trim();if(!v)return '';if(p.platform==='Egen länk')return /^https:\/\//i.test(v)?v:'';if(p.platform==='Instagram')return 'https://ig.me/m/'+encodeURIComponent(v.replace(/^@/,''));if(p.platform==='Snapchat')return 'https://www.snapchat.com/add/'+encodeURIComponent(v.replace(/^@/,''));if(p.platform==='WhatsApp'){let n=v.replace(/\D/g,'');return n?'https://wa.me/'+n:''}if(p.platform==='SMS/iMessage'){let n=v.replace(/[^\d+]/g,'');return n?'sms:'+n:''}return ''}function next(p){if(p.status!=='active')return 'Ingen åtgärd – arkiverad';if(p.interest==='Lågt')return 'Avvakta och respektera hennes signaler';if(p.stage==='contact')return 'Överväg ett första meddelande';if(p.stage==='conversation')return 'Fortsätt lära känna varandra';if(p.stage==='engaged')return 'Överväg att föreslå en dejt';if(p.stage==='proposed')return 'Avvakta svar på inbjudan';if(p.stage==='scheduled')return 'Bekräfta planen vid behov';if(p.stage==='first')return 'Fundera på om du vill ses igen';return 'Fortsätt lära känna varandra'}function go(t){tab=t;profile=null;render()}function showProfile(id){profile=id;tab='pipeline';render()}function render(){document.getElementById('subtitle').textContent=profile?'Kontaktprofil':tab==='pipeline'?'Din översikt':({messages:'Meddelandebyggare',insights:'Konvertering och statistik',settings:'Data och integritet'})[tab];document.getElementById('addTop').classList.toggle('hide',!!profile);document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.getElementById('screen').innerHTML=profile?renderProfile():tab==='pipeline'?renderPipeline():tab==='messages'?renderMessages():tab==='insights'?renderInsights():renderSettings()}
function renderPipeline(){let active=db.people.filter(p=>p.status==='active');let actions=active.filter(p=>!['proposed'].includes(p.stage)&&p.interest!=='Lågt').sort((a,b)=>({scheduled:0,contact:1,engaged:2,first:3,conversation:4,repeat:5}[a.stage]??6)-({scheduled:0,contact:1,engaged:2,first:3,conversation:4,repeat:5}[b.stage]??6)).slice(0,3);let visible=active.filter(p=>p.name.toLowerCase().includes(filter.toLowerCase()));return `<div class="grid"><div class="stat"><strong>${active.length}</strong><small>Aktiva</small></div><div class="stat"><strong>${active.filter(p=>p.stage==='scheduled').length}</strong><small>Bokade dejter</small></div><div class="stat"><strong>${db.people.filter(p=>p.events.some(e=>e.type==='first')).length}</strong><small>Första dejter</small></div></div><h2>Nästa steg</h2><div class="card">${actions.length?actions.map(p=>`<button class="person" onclick="showProfile('${p.id}')"><div class="row"><strong>${esc(p.name)}</strong><span>›</span></div><div class="sub">${esc(next(p))}</div></button>`).join(''):'<div class="empty">Inga föreslagna åtgärder ännu.</div>'}</div><div class="row"><h2>Pipeline</h2><button class="btn ghost" onclick="showArchive()">Arkiv (${db.people.length-active.length})</button></div><input aria-label="Sök kontakter" placeholder="Sök kontakter..." value="${esc(filter)}" oninput="filter=this.value;renderPipelineOnly()" id="searchbox"><div id="stageList">${renderStages(visible)}</div>`}function renderPipelineOnly(){const focus=document.activeElement;const pos=focus?.selectionStart;document.getElementById('stageList').innerHTML=renderStages(db.people.filter(p=>p.status==='active'&&p.name.toLowerCase().includes(filter.toLowerCase())));if(focus?.id==='searchbox'&&pos!=null)focus.setSelectionRange(pos,pos)}function renderStages(visible){return STAGES.map(([id,label])=>{let list=visible.filter(p=>p.stage===id);return `<div class="section"><button class="stagehead" onclick="collapsed['${id}']=!collapsed['${id}'];renderPipelineOnly()">${label} <span class="muted">${list.length} ${collapsed[id]?'⌄':'⌃'}</span></button>${collapsed[id]?'':list.length?list.map(p=>`<button class="person" onclick="showProfile('${p.id}')"><div class="row"><strong>${esc(p.name)}</strong><span class="pill ${p.interest==='Högt'?'high':p.interest==='Lågt'?'low':''}">${esc(p.interest)}</span></div><div class="sub">${esc(p.source)} · ${esc(next(p))}</div></button>`).join(''):'<div class="empty">Inga kontakter</div>'}</div>`}).join('')}
function openAdd(){profile='new';render()}function renderProfile(){if(profile==='new')return `<button class="back" onclick="go('pipeline')">‹ Tillbaka</button><h2>Ny kontakt</h2><div class="card"><div class="field"><label>Namn eller smeknamn *</label><input id="newName" maxlength="80" placeholder="T.ex. Emma"></div><div class="field"><label>Var träffades ni? *</label><select id="newSource">${SOURCES.map(s=>`<option>${s}</option>`).join('')}</select></div><button class="btn wide" onclick="createPerson()">Lägg till kontakt</button><p class="muted"><small>Du kan lägga till chattlänk och andra uppgifter efteråt.</small></p></div>`;let p=person(profile);if(!p){profile=null;return renderPipeline()}let url=getLink(p);return `<button class="back" onclick="go('pipeline')">‹ Pipeline</button><div class="row"><div><h1>${esc(p.name)}</h1><small>${esc(p.source)} · Skapad ${date(p.created)}</small></div><span class="pill">${p.status==='active'?'Aktiv':p.status==='inactive'?'Inaktiv':p.status==='relationship'?'Relation':'Avslutad'}</span></div><h2>Snabbåtgärder</h2><div class="twocol"><button class="btn secondary" onclick="openChat('${p.id}')">↗ Öppna chatt</button><button class="btn" onclick="msgTarget='${p.id}';go('messages')">✉ Skapa meddelande</button></div>${!url?'<p class="muted"><small>Lägg till plattform och användarnamn/nummer nedan för att aktivera chattgenvägen.</small></p>':''}<div class="card section"><h3>Nästa steg</h3><p>${esc(next(p))}</p></div><div class="card"><div class="field"><label>Pipeline-steg</label><select onchange="changeStage('${p.id}',this.value)">${STAGES.map(([id,l])=>`<option value="${id}" ${p.stage===id?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label>Hennes upplevda intresse</label><select onchange="updateField('${p.id}','interest',this.value)">${INTEREST.map(s=>`<option ${p.interest===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Status</label><select onchange="updateField('${p.id}','status',this.value)">${[['active','Aktiv'],['inactive','Inaktiv'],['declined','Tackat nej'],['incompatible','Inte kompatibla'],['relationship','Relation']].map(([v,l])=>`<option value="${v}" ${p.status===v?'selected':''}>${l}</option>`).join('')}</select></div></div><div class="card"><h3>Logga en händelse</h3><div class="field"><select id="eventType">${EVENTS.map(([id,l])=>`<option value="${id}">${l}</option>`).join('')}</select></div><button class="btn wide secondary" onclick="logEvent('${p.id}')">+ Registrera händelse</button></div><div class="card"><h3>Chattgenväg</h3><div class="field"><label>Plattform</label><select id="platform" onchange="updateField('${p.id}','platform',this.value)">${PLATFORMS.map(s=>`<option ${p.platform===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Användarnamn, telefonnummer eller HTTPS-länk</label><input id="handle" value="${esc(p.handle)}" placeholder="@namn, +4670..., eller https://..." onchange="updateField('${p.id}','handle',this.value)"></div><small>Instagram- och Snapchat-länkar kan öppna en profil snarare än exakt chatt. Testa genvägen i din telefon.</small></div><div class="card"><h3>Anteckningar (valfritt)</h3><textarea id="notes" placeholder="Detaljer du vill minnas..." onchange="updateField('${p.id}','notes',this.value)">${esc(p.notes)}</textarea></div><h2>Händelsehistorik</h2><div class="card">${[...p.events].reverse().map(e=>`<div class="event"><strong>${esc(e.label)}</strong><div><small>${date(e.at)}</small></div></div>`).join('')||'<p class="empty">Inga händelser ännu.</p>'}</div><button class="btn danger wide" onclick="removePerson('${p.id}')">Ta bort kontakt</button>`}
function createPerson(){let n=document.getElementById('newName').value.trim();if(!n)return alert('Ange ett namn');let id=String(Date.now())+Math.random().toString(36).slice(2,6);db.people.push({id,name:n,source:document.getElementById('newSource').value,stage:'contact',interest:'Okänt',status:'active',created:Date.now(),updated:Date.now(),platform:'Ingen',handle:'',notes:'',events:[{type:'created',label:'Kontakt tillagd',at:Date.now()}]});save();showProfile(id)}function updateField(id,k,v){let p=person(id);if(!p)return;p[k]=v;p.updated=Date.now();save();render()}function changeStage(id,s){let p=person(id);if(p.stage===s)return;p.stage=s;p.updated=Date.now();p.events.push({type:'manual',label:'Steg ändrat manuellt till '+stage(s),at:Date.now()});save();render()}function logEvent(id){let p=person(id),e=EVENTS.find(e=>e[0]===document.getElementById('eventType').value);if(!e)return;p.events.push({type:e[0],label:e[1],at:Date.now()});if(STAGES.findIndex(s=>s[0]===e[2])>STAGES.findIndex(s=>s[0]===p.stage))p.stage=e[2];p.updated=Date.now();save();render()}function removePerson(id){if(confirm('Ta bort kontakten och hela historiken permanent?')){db.people=db.people.filter(p=>p.id!==id);save();go('pipeline')}}function openChat(id){let p=person(id),url=getLink(p);if(!url)return alert('Lägg först till en fungerande chattgenväg.');window.open(url,'_blank','noopener,noreferrer')}function showArchive(){let arr=db.people.filter(p=>p.status!=='active');document.getElementById('screen').innerHTML=`<button class="back" onclick="render()">‹ Tillbaka</button><h2>Arkiv</h2>${arr.length?arr.map(p=>`<button class="person" onclick="showProfile('${p.id}')"><strong>${esc(p.name)}</strong><div class="sub">${esc(p.status)} · ${esc(stage(p.stage))}</div></button>`).join(''):'<p class="empty">Arkivet är tomt.</p>'}`}
function renderMessages(){let p=person(msgTarget);return `<div class="card"><h3>Skapa meddelande</h3><div class="field"><label>Kontakt (valfritt)</label><select id="msgPerson" onchange="msgTarget=this.value;render()"><option value="">Ingen vald</option>${db.people.map(x=>`<option value="${x.id}" ${msgTarget===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>${p?`<div class="notice">${esc(p.source)} · ${esc(stage(p.stage))} · Intresse: ${esc(p.interest)}</div>`:''}<div class="field"><label>Situation</label><select id="msgSituation"><option value="first">Första meddelandet</option><option value="talk">Pågående konversation</option><option value="invite">Föreslå dejt</option><option value="follow">Följ upp inbjudan</option><option value="after">Efter en dejt</option><option value="confirm">Bekräfta en bokad dejt</option></select></div><div class="field"><label>Kontext (valfritt)</label><textarea id="msgContext" placeholder="Vad hände? Vad pratade ni om? Klistra gärna in ett relevant utdrag."></textarea></div><button class="btn wide" onclick="generateMessages()">Skapa 3 förslag</button></div><div id="messageResults"></div><p class="muted"><small>Offlineversionen använder färdiga svenska formuleringar. Kontexten läses inte av någon AI och skickas inte någonstans. Anpassa förslagen själv innan du skickar.</small></p>`}
const BANK={first:[['Kul att träffa dig igår! Hur mår du idag?','Hur överlevde du gårdagen? 😄','Det var kul att ses igår. Jag hade gärna träffats igen.'],['Hej! Kul att matcha med dig. Hur har din vecka varit?','Okej, viktig fråga: vad är det roligaste du gjort på sistone?','Du verkar intressant. Ska vi ta en kaffe i veckan?']],talk:[['Haha, berätta mer om det där!','Okej, nu måste du utveckla det där 😄','Det här vill jag höra mer om när vi ses.'],['Det låter kul! Hur kom du in på det?','Det där kräver nästan en förklaring 😄','Jag gillar att prata med dig. Ska vi fortsätta över en kaffe?']],invite:[['Du verkar trevlig att hänga med. Ska vi ta ett glas i veckan?','Jag tycker vi borde se om vi har lika kul utanför chatten 😄','Jag vill gärna träffa dig. Är du ledig torsdag kväll?']],follow:[['Hej! Ville bara kolla om du fortfarande är sugen på att ses.','Ska vi fortfarande försöka styra upp något?','Jag är fortfarande på för att ses om du är det. Hör av dig!']],after:[['Tack för senast, jag hade verkligen trevligt!','Det var kul att ses! Jag tycker vi får göra om det 😄','Jag hade riktigt trevligt och vill gärna ses igen.']],confirm:[['Ser fram emot att ses! Funkar tiden vi bestämde fortfarande?','Då kör vi på vår plan! Ses snart 😄','Hej! Ville bara bekräfta att vi ses som planerat.']]};function generateMessages(){let sit=document.getElementById('msgSituation').value,p=person(msgTarget);let target=document.getElementById('messageResults');if(p&&(p.status!=='active'||p.interest==='Lågt')&&['invite','follow'].includes(sit)){target.innerHTML='<div class="notice">Rekommendation: Avvakta. Respektera ett nej och undvik upprepade uppföljningar när intresset är lågt eller kontakten avslutats.</div>';return}let variant=p?.source==='Hinge'?1:0;let list=BANK[sit][Math.min(variant,BANK[sit].length-1)];drafts=list;target.innerHTML='<h2>Förslag</h2>'+list.map((s,i)=>`<div class="card"><div class="row"><strong>${['Naturligt','Lekfullt','Direkt'][i]}</strong><span class="pill">${i===0?'Standard':'Alternativ'}</span></div><div class="message">${esc(s)}</div><div class="twocol"><button class="btn secondary" onclick="copyMessage(${i})">Kopiera</button><button class="btn secondary" onclick="copyAndChat(${i})">Kopiera + chatt ↗</button></div></div>`).join('')+'<div class="notice">Tips: Lägg till en verklig detalj från er konversation. Att kopiera ett meddelande registrerar inte att det skickats.</div>'}async function copyMessage(i){let s=drafts[i];try{await navigator.clipboard.writeText(s);alert('Kopierat!')}catch{let a=document.createElement('textarea');a.value=s;document.body.append(a);a.select();document.execCommand('copy');a.remove();alert('Meddelandet kopierat (om din webbläsare tillåter det).')}}async function copyAndChat(i){await copyMessage(i);if(msgTarget)openChat(msgTarget);else alert('Välj en kontakt för att öppna chatten.')}
function renderInsights(){let all=db.people.length,counts=STAGES.map(([id,label],i)=>({label,count:db.people.filter(p=>STAGES.findIndex(x=>x[0]===p.stage)>=i).length}));let first=db.people.filter(p=>p.events.some(e=>e.type==='first')).length;return `<h2>Pipeline-översikt</h2><div class="grid"><div class="stat"><strong>${all}</strong><small>Kontakter</small></div><div class="stat"><strong>${db.people.filter(p=>p.events.some(e=>e.type==='scheduled')).length}</strong><small>Bokade</small></div><div class="stat"><strong>${first}</strong><small>Första dejter</small></div></div><h2>Stegfördelning</h2><div class="card">${counts.map(x=>`<div style="margin-bottom:15px"><div class="row"><small>${x.label}</small><strong>${x.count}</strong></div><div class="bar"><div style="width:${all?100*x.count/all:0}%"></div></div></div>`).join('')}</div><div class="notice">Statistiken är preliminär. Stegfördelningen använder nuvarande högsta registrerade steg och kan påverkas av manuella korrigeringar. Första dejter räknas bara när händelsen har loggats.</div>`}
function renderSettings(){return `<h2>Din data</h2><div class="card"><p>Kontakter sparas lokalt i den här webbläsarens lagring på din telefon. Ingen server eller inloggning används.</p><div class="stack"><button class="btn secondary wide" onclick="exportData()">Exportera säkerhetskopia (.json)</button><label for="importFile" class="btn secondary" style="text-align:center">Importera säkerhetskopia</label><input id="importFile" class="hide" type="file" accept=".json,application/json" onchange="importData(this)"><button class="btn danger wide" onclick="clearData()">Radera all data</button></div></div><h2>Om appen</h2><div class="card"><p><strong>Dating Pipeline v1</strong></p><p class="muted">Offline HTML-app. Meddelandeförslagen är mallbaserade, inte AI-genererade. Inga notiser, automatisk chattavläsning eller synkronisering.</p><p class="muted">Viktigt: Om du öppnar filen i en annan app, byter webbläsare eller rensar webbplatsdata kan lokal lagring saknas. Exportera regelbundet en säkerhetskopia.</p></div>`}function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='dating-pipeline-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function importData(input){let file=input.files?.[0];if(!file)return;file.text().then(s=>{let d=JSON.parse(s);if(!Array.isArray(d.people))throw Error('Ogiltig fil');if(confirm('Ersätt alla befintliga kontakter med säkerhetskopian?')){db=d;save();go('pipeline')}}).catch(e=>alert('Import misslyckades: '+e.message))}function clearData(){if(confirm('Radera ALLA kontakter och händelser? Detta går inte att ångra.')){db={people:[]};save();go('pipeline')}}render();
</script></body></html>
